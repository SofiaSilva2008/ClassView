<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>ClassView - Adicionar Disciplina</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h1 class="logo">Class<span>View</span></h1>

    <nav>
      <a href="{{ url_for('coordenador.dashboard_coordenador') }}">
        <i class="fa-solid fa-table-cells-large"></i> Dashboard
      </a>
      
      <a class="active" href="{{ url_for('coordenador.adicionar_coordenador') }}">
        <i class="fa-solid fa-plus"></i> Gerenciamento
      </a>

      <a href="{{ url_for('professor.relatorios') }}">
        <i class="fa-regular fa-file-lines"></i> Relatório
      </a>

      <a href="{{ url_for('professor.AjudaTutoriais') }}">
        <i class="fa-solid fa-info"></i> Ajuda & tutoriais
      </a>

      <a href="{{ url_for('coordenador.perfil_coordenador') }}">
        <i class="fa-regular fa-circle-user"></i> Meu perfil
      </a>
    </nav>

    <a href="{{ url_for('auth.logout') }}" class="logout">
      <i class="fa-solid fa-arrow-right-from-bracket"></i> Sair
    </a>
  </aside>

  <!-- CONTEÚDO -->
  <main class="content">

    <header class="topbar">
      <h2 class="belleza-text">Adicionar Disciplina</h2>
    </header>

    <section class="turmas-section">

      <!-- FORMULÁRIO -->
      <form method="POST" class="filtros">

        <div class="filtro">
          <label>Nome da Disciplina</label>
          <input
            type="text"
            name="nome"
            placeholder="Digite o nome da disciplina"
            required
          >
        </div>

        <div class="filtro">
          <label>Professor responsável</label>
          <select name="professor_id" required>
            <option value="">Selecione um professor</option>
            {% for professor in professores %}
              <option value="{{ professor.id }}">
                {{ professor.nome }}
              </option>
            {% endfor %}
          </select>
        </div>

        <div class="filtro">
          <label>Turmas que terão essa disciplina</label>
          <select name="turmas" multiple required>
            {% for turma in turmas %}
              <option value="{{ turma.id }}">
                {{ turma.nome }}
              </option>
            {% endfor %}
          </select>
          <small>Segure Ctrl (ou Cmd) para selecionar mais de uma turma</small>
        </div>


      </form>

      <!-- AÇÕES -->
      <div class="turmas-actions" style="margin-top: 24px;">
        <button class="btn-solid" onclick="document.querySelector('form').submit()">
          Salvar Disciplina
        </button>

        <a href="{{ url_for('coordenador.adicionar_coordenador') }}" class="btn-outline">
          Voltar
        </a>
      </div>

    </section>

  </main>

</div>

</body>
</html>
