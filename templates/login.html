<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>ClassView - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styleLogin.css') }}">
</head>
<body>

<div class="container">
    <div class="logo">Class<span>View</span></div>
    <h2>Bem-vindo de volta!</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="msg {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}


    <form method="POST" action="{{ url_for('auth.login') }}">

        <label>E-mail Institucional</label>
        <input type="email"
               name="email"
               placeholder="seu@email.edu.br"
               required>

        <label>Senha</label>
        <input type="password"
               name="senha"
               placeholder="Digite sua senha"
               required>

        <div class="forgot">
            <a href="#">Esqueci minha senha</a>
        </div>

        <button type="submit">ENTRAR</button>

    </form>

    <div class="footer-text">
        Não tem uma conta?
        <a href="{{ url_for('auth.cadastro') }}">Cadastre-se</a>
    </div>
</div>

</body>
</html>
